<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">MLOps platform architecture</title>
  <desc id="desc">Angular UI calls FastAPI, which validates domain rules and persists to SQLite, with seed data and structured logs.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17231e} .box{fill:#edf7e9;stroke:#16704b;stroke-width:2} .store{fill:#f8faf7;stroke:#617069;stroke-width:2} .arrow{stroke:#16704b;stroke-width:3;marker-end:url(#arrowhead)}</style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16704b"/></marker></defs>
  <rect class="box" x="40" y="130" width="190" height="90" rx="6"/><text x="135" y="170" text-anchor="middle" font-size="22">Angular UI</text><text x="135" y="198" text-anchor="middle" font-size="14">Inventory and operations</text>
  <rect class="box" x="340" y="100" width="220" height="150" rx="6"/><text x="450" y="145" text-anchor="middle" font-size="22">FastAPI API</text><text x="450" y="175" text-anchor="middle" font-size="14">Validation and lifecycle rules</text><text x="450" y="200" text-anchor="middle" font-size="14">Deployments and metrics</text>
  <rect class="store" x="700" y="80" width="180" height="90" rx="6"/><text x="790" y="120" text-anchor="middle" font-size="22">SQLite</text><text x="790" y="148" text-anchor="middle" font-size="14">Persistent state</text>
  <rect class="store" x="700" y="220" width="180" height="70" rx="6"/><text x="790" y="262" text-anchor="middle" font-size="20">Artifacts</text>
  <rect class="store" x="950" y="145" width="110" height="70" rx="6"/><text x="1005" y="187" text-anchor="middle" font-size="18">Logs</text>
  <line class="arrow" x1="230" y1="175" x2="340" y2="175"/><line class="arrow" x1="560" y1="145" x2="700" y2="125"/><line class="arrow" x1="560" y1="205" x2="700" y2="255"/><line class="arrow" x1="560" y1="175" x2="950" y2="180"/>
</svg>
